name: CI

on:
  push:
  pull_request:

jobs:
  released:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  aprsd-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install 'git+https://github.com/craigerl/aprsd.git@master'
      - run: pip install -e . --no-deps
      - run: pip install 'pytest>=8' 'pytest-cov>=5' 'ruff>=0.8'
      - run: ruff check .
      - run: pytest
