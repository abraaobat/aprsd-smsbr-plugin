[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aprsd-smsbr-plugin"
version = "0.1.0a0"
description = "Brazilian APRS to SMS gateway plugin for APRSD, DigiPi and Dire Wolf"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "SMSBR contributors"}]
keywords = ["aprs", "aprs-is", "aprsd", "digipi", "direwolf", "ham-radio", "sms", "brazil"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Communications :: Ham Radio",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["aprsd>=5.0,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/abraaobat/aprsd-smsbr-plugin"
Issues = "https://github.com/abraaobat/aprsd-smsbr-plugin/issues"
Source = "https://github.com/abraaobat/aprsd-smsbr-plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
